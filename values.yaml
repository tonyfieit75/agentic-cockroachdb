namespace: agentic-db

# -------------------------------
# CockroachDB Cluster Configuration
# -------------------------------
cockroachdb:
  nodes: 5
  storageClass: managed-nvme
  storage: 1Ti
  cpu: 8
  memory: 32Gi
  image: quay.io/tonyfieit75/cockroachdb-s390x:23.1.2   # <-- custom s390x DB image

# -------------------------------
# CockroachDB Operator Configuration
# -------------------------------
operator:
  enabled: true
  replicas: 1
  image:
    repository: quay.io/tonyfieit75/cockroach-operator
    tag: s390x-v2.10.0
    pullPolicy: IfNotPresent
  serviceAccountName: cockroach-operator
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -------------------------------
# Agentic Orchestrator Configuration
# -------------------------------
agents:
  image: quay.io/tonyfieit75/agentic-orchestrator:s390x-latest  # <-- orchestrator image
  replicas: 1
  feedbackInterval: 30m
  prometheusEndpoint: http://prometheus:9090
  grafanaEndpoint: http://grafana:3000
  targetSLA:
    tps: 10000
    latency_ms: 5

# -------------------------------
# Monitoring Configuration
# -------------------------------
monitoring:
  enabled: true
  storageClass: managed-nvme
  prometheusStorage: 50Gi
  grafanaStorage: 20Gi

