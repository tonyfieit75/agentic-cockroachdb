apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentic-operator
rules:
  - apiGroups: ["*"]
    resources: ["pods","services","statefulsets","configmaps","crdclusters","deployments"]
    verbs: ["get","list","create","delete","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentic-operator-binding
roleRef:
  kind: ClusterRole
  name: agentic-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: agentic-sa
    namespace: {{ .Values.namespace }}

