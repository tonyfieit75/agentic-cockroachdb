apiVersion: integreatly.org/v1alpha1
kind: Grafana
metadata:
  name: agentic-grafana
  namespace: {{ .Values.namespace }}
spec:
  dataStorage:
    type: pvc
    pvc:
      storageClassName: {{ .Values.monitoring.storageClass }}
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.monitoring.grafanaStorage }}

